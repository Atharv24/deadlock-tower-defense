// =========================================================================
// Deadlock Tower Defense - Phase 3 Creep Scaling & Boon Config (td_scaling.cfg)
// =========================================================================
// Easily modify the independent scaling dimensions below:
//   1. SIZE     (3D Model Scale of Creeps via td_size_tier1..5)
//   2. STRENGTH (Creep Max Health & Outgoing Damage - Scaled down 100x total: +15 -> +90 HP)
//   3. SOULS    (Soul Bounty per Creep via citadel_trooper_gold_reward & td_grow_souls)
//   4. NUMBERS  (Extra Creep Squads per Wave via citadel_spawn_trooper_wave)
//   5. TOMES    (Direct-to-Hero permanent stat Boon with 10% probability on creep kill)
// =========================================================================

// Keep sudden-death trooper health multiplier disabled (9999s) so base HP is not multiplied by 3x
citadel_trooper_health_mult_gametime 9999

// First wave spawns 5 seconds after load; disable vanilla 20m/35m interval overrides
citadel_trooper_spawn_initial 5
citadel_trooper_spawn_interval_late_time 999
citadel_trooper_spawn_interval_very_late_time 999

// Raise lane cap so large multi-squad waves never get throttled (default is 16)
citadel_trooper_max_per_lane 120

// =========================================================================
// 1. SIZE SCALING (3D Model Scale of Creeps)
// =========================================================================
// Each tier adds a permanent model-scale modifier to all lane creeps (1.25x -> 3.25x giant creeps)
alias td_size_tier1 "ent_fire npc_trooper AddModifier td_creep_size_1"
alias td_size_tier2 "td_size_tier1; ent_fire npc_trooper AddModifier td_creep_size_2"
alias td_size_tier3 "td_size_tier2; ent_fire npc_trooper AddModifier td_creep_size_3"
alias td_size_tier4 "td_size_tier3; ent_fire npc_trooper AddModifier td_creep_size_4"
alias td_size_tier5 "td_size_tier4; ent_fire npc_trooper AddModifier td_creep_size_5"

// Active size tier (starts at Tier 1 and escalates every 20s wave tick)
alias td_apply_size "td_size_tier1"
alias td_grow_size_w1 "alias td_apply_size td_size_tier2; alias td_grow_size td_grow_size_w2"
alias td_grow_size_w2 "alias td_apply_size td_size_tier3; alias td_grow_size td_grow_size_w3"
alias td_grow_size_w3 "alias td_apply_size td_size_tier4; alias td_grow_size td_grow_size_w4"
alias td_grow_size_w4 "alias td_apply_size td_size_tier5"
alias td_grow_size "td_grow_size_w1"

// =========================================================================
// 2. STRENGTH SCALING (Creep Max Health & Outgoing Damage - Scaled Down 10x More)
// =========================================================================
// Configurable HP scaling values per wave tier (scaled down 10x more: +15 -> +25 -> +40 -> +60 -> +90 HP,
// i.e. 315 -> 325 -> 340 -> 360 -> 390 total HP on top of 300 base HP):
alias td_hp_tier1 "ent_fire npc_trooper SetMaxHealth 315; ent_fire npc_trooper SetHealth 315"
alias td_hp_tier2 "ent_fire npc_trooper SetMaxHealth 325; ent_fire npc_trooper SetHealth 325"
alias td_hp_tier3 "ent_fire npc_trooper SetMaxHealth 340; ent_fire npc_trooper SetHealth 340"
alias td_hp_tier4 "ent_fire npc_trooper SetMaxHealth 360; ent_fire npc_trooper SetHealth 360"
alias td_hp_tier5 "ent_fire npc_trooper SetMaxHealth 390; ent_fire npc_trooper SetHealth 390"

alias td_strength_tier1 "ent_fire npc_trooper AddModifier td_creep_strength_1; td_hp_tier1"
alias td_strength_tier2 "ent_fire npc_trooper AddModifier td_creep_strength_2; td_hp_tier2"
alias td_strength_tier3 "ent_fire npc_trooper AddModifier td_creep_strength_3; td_hp_tier3"
alias td_strength_tier4 "ent_fire npc_trooper AddModifier td_creep_strength_4; td_hp_tier4"
alias td_strength_tier5 "ent_fire npc_trooper AddModifier td_creep_strength_5; td_hp_tier5"

alias td_apply_strength "td_strength_tier1"
alias td_grow_strength_w1 "alias td_apply_strength td_strength_tier2; alias td_grow_strength td_grow_strength_w2"
alias td_grow_strength_w2 "alias td_apply_strength td_strength_tier3; alias td_grow_strength td_grow_strength_w3"
alias td_grow_strength_w3 "alias td_apply_strength td_strength_tier4; alias td_grow_strength td_grow_strength_w4"
alias td_grow_strength_w4 "alias td_apply_strength td_strength_tier5; alias td_grow_strength td_grow_strength_w5"
alias td_grow_strength_w5 "td_hp_tier5"
alias td_grow_strength "td_grow_strength_w1"

// =========================================================================
// 3. SOULS SCALING (Soul Bounty per Creep)
// =========================================================================
// Starting Souls per creep (300 Souls on Wave 1) + passive bonus per minute (150/min)
citadel_trooper_gold_reward 300
citadel_trooper_gold_reward_bonus_per_minute 150

// Per-Wave Souls Growth (+25 Souls per creep every 20s, up to 10000)
alias td_grow_souls "incrementvar citadel_trooper_gold_reward 100 10000 25"

// =========================================================================
// 4. NUMBERS SCALING (Extra Creep Squads Spawned per Wave)
// =========================================================================
// Each citadel_spawn_trooper_wave call spawns +4 creeps in Center Lane:
//   Tier 1 = +4 extra creeps (8 total)
//   Tier 2 = +8 extra creeps (12 total)
//   Tier 3 = +12 extra creeps (16 total)
//   Tier 4 = +16 extra creeps (20 total)
alias td_numbers_tier1 "citadel_spawn_trooper_wave"
alias td_numbers_tier2 "citadel_spawn_trooper_wave; citadel_spawn_trooper_wave"
alias td_numbers_tier3 "citadel_spawn_trooper_wave; citadel_spawn_trooper_wave; citadel_spawn_trooper_wave"
alias td_numbers_tier4 "citadel_spawn_trooper_wave; citadel_spawn_trooper_wave; citadel_spawn_trooper_wave; citadel_spawn_trooper_wave"

alias td_grow_numbers_w1 "td_numbers_tier1; alias td_grow_numbers td_grow_numbers_w2"
alias td_grow_numbers_w2 "td_numbers_tier2; alias td_grow_numbers td_grow_numbers_w3"
alias td_grow_numbers_w3 "td_numbers_tier3; alias td_grow_numbers td_grow_numbers_w4"
alias td_grow_numbers_w4 "td_numbers_tier4"
alias td_grow_numbers "td_grow_numbers_w1"

// =========================================================================
// 5. DIRECT-TO-PLAYER TOME REWARDS ON CREEP KILL (10% Probability)
// =========================================================================
// Every creep kill triggers [PR#]td_tome_gate -> exec td_grant_tome -> td_try_grant_tome.
// With a 10% probability (1 in 10 roll), td_roll_tome grants a permanent stackable
// Tome modifier directly onto your Hero pawn:
//   - td_tome_spirit   : +8 Spirit Power
//   - td_tome_weapon   : +10% Weapon Damage & +6% Max Ammo
//   - td_tome_firerate : +5% Fire Rate
//   - td_tome_health   : +80 Max HP & +2.0 HP/s Regen
//   - td_tome_cooldown : +3% Cooldown Reduction & +1 Ability Point
//   - td_tome_range    : +4% Ability Range/Radius & +1 Hero Power Level
// =========================================================================
alias td_tome_1 "subclass_create td_tome_spirit; addmodifier td_tome_spirit; echo [TD Phase 3] >>> BOON GRANTED (10% Roll!): Tome of Spirit (+8 Spirit Power) <<<; alias td_roll_tome td_tome_2"
alias td_tome_2 "subclass_create td_tome_weapon; addmodifier td_tome_weapon; echo [TD Phase 3] >>> BOON GRANTED (10% Roll!): Tome of Weapon Power (+10% Weapon Damage & +6% Max Ammo) <<<; alias td_roll_tome td_tome_3"
alias td_tome_3 "subclass_create td_tome_firerate; addmodifier td_tome_firerate; echo [TD Phase 3] >>> BOON GRANTED (10% Roll!): Tome of Fire Rate (+5% Fire Rate) <<<; alias td_roll_tome td_tome_4"
alias td_tome_4 "subclass_create td_tome_health; addmodifier td_tome_health; echo [TD Phase 3] >>> BOON GRANTED (10% Roll!): Tome of Vitality (+80 Max HP & +2 HP/s Regen) <<<; alias td_roll_tome td_tome_5"
alias td_tome_5 "subclass_create td_tome_cooldown; addmodifier td_tome_cooldown; giveap 1; echo [TD Phase 3] >>> BOON GRANTED (10% Roll!): Tome of Cooldowns (+3% Cooldown Reduction & +1 Ability Point) <<<; alias td_roll_tome td_tome_6"
alias td_tome_6 "subclass_create td_tome_range; addmodifier td_tome_range; givelevelupgold; echo [TD Phase 3] >>> BOON GRANTED (10% Roll!): Tome of Arcane Reach (+4% Ability Range/Radius & +1 Hero Power Level) <<<; alias td_roll_tome td_tome_1"
alias td_roll_tome "td_tome_1"

// 10% Probability Roll (1 in 10 chance per creep kill):
alias td_boon_rng_1  "alias td_try_grant_tome td_boon_rng_2"
alias td_boon_rng_2  "alias td_try_grant_tome td_boon_rng_3"
alias td_boon_rng_3  "alias td_try_grant_tome td_boon_rng_4"
alias td_boon_rng_4  "alias td_try_grant_tome td_boon_rng_5"
alias td_boon_rng_5  "alias td_try_grant_tome td_boon_rng_6"
alias td_boon_rng_6  "alias td_try_grant_tome td_boon_rng_7"
alias td_boon_rng_7  "alias td_try_grant_tome td_boon_rng_8"
alias td_boon_rng_8  "alias td_try_grant_tome td_boon_rng_9"
alias td_boon_rng_9  "alias td_try_grant_tome td_boon_rng_10"
alias td_boon_rng_10 "td_roll_tome; alias td_try_grant_tome td_boon_rng_1"
alias td_try_grant_tome "td_boon_rng_4"

// =========================================================================
// AUTOMATIC WAVE HOOKS (Triggered by logic_auto in dl_defense.vpk)
// =========================================================================
alias td_hook_trooper_tomes "ent_fire npc_trooper AddOutput OnDeath>[PR#]td_tome_gate>Trigger>>0>1; ent_fire npc_trooper AddOutput OnKilled>[PR#]td_tome_gate>Trigger>>0>1"
alias td_apply_creep_buffs "td_apply_size; td_apply_strength; td_hook_trooper_tomes"
alias td_wave_tick_client "td_grow_numbers; td_grow_size; td_grow_strength; td_apply_creep_buffs"

echo "==================================================================="
echo "[TD Phase 3] Loaded td_scaling.cfg (10x Further Scaled-Down HP + 10% Boon Probability)"
echo "  1. SIZE:     1.25x -> 3.25x Giant Super-Troopers (td_size_tier1..5)"
echo "  2. STRENGTH: +15 -> +90 HP (+0.8% -> +3.0% Max HP) & +5% -> +20% Damage"
echo "  3. SOULS:    300 start + 25 Souls/creep per wave (td_grow_souls)"
echo "  4. NUMBERS:  +4 -> +16 extra creeps spawned per wave (td_numbers_tier1..4)"
echo "  5. TOMES:    10% probability per creep kill to grant a permanent Hero Boon!"
echo "==================================================================="
