// =========================================================================
// 5. BOSS WAVES — GIANT ENEMY HERO EVERY 10TH WAVE (Waves 10, 20, 30, 40, 50+)
// =========================================================================
// Configure Enemy Hero Bot AI so Boss Heroes actively move, shoot, melee & cast abilities:
citadel_default_bot_difficulty 3
citadel_bot_test_mode 0
citadel_bot_brain_disable_movement 0
citadel_bot_brain_disable_attacks 0
citadel_bot_brain_disable_gun_attacks 0
citadel_bot_use_ability 1
citadel_bot_use_ability_repeated 1

// Each Boss Wave kicks any leftover dead bot, spawns a fresh Enemy Hero Boss (Team 3 Sapphire),
// unlocks all 4 abilities, and applies the Giant Boss modifier exclusively to the Enemy Hero
// (by applying to 'player' and immediately stripping from '!player' in the same tick):
alias td_boss_wave_10 "bot_kick_all; citadel_create_unit hero_atlas enemy; citadel_bot_give_all_abilities; ent_fire player AddModifier td_boss_hero_stats_1; ent_fire !player RemoveModifier td_boss_hero_stats_1; echo [TD BOSS WAVE 10] >>> GIANT ABRAMS (1.65x Size, +2500 HP, +100% Gun / +50% Total Dmg) HAS ENTERED THE LANE! <<<"
alias td_boss_wave_20 "bot_kick_all; citadel_create_unit hero_warden enemy; citadel_bot_give_all_abilities; ent_fire player AddModifier td_boss_hero_stats_2; ent_fire !player RemoveModifier td_boss_hero_stats_2; echo [TD BOSS WAVE 20] >>> GIANT WARDEN (1.75x Size, +5500 HP, +175% Gun / +100% Total Dmg) HAS ENTERED THE LANE! <<<"
alias td_boss_wave_30 "bot_kick_all; citadel_create_unit hero_gigawatt enemy; citadel_bot_give_all_abilities; ent_fire player AddModifier td_boss_hero_stats_3; ent_fire !player RemoveModifier td_boss_hero_stats_3; echo [TD BOSS WAVE 30] >>> GIANT SEVEN (1.85x Size, +10000 HP, +250% Gun / +160% Total Dmg) HAS ENTERED THE LANE! <<<"
alias td_boss_wave_40 "bot_kick_all; citadel_create_unit hero_bebop enemy; citadel_bot_give_all_abilities; ent_fire player AddModifier td_boss_hero_stats_4; ent_fire !player RemoveModifier td_boss_hero_stats_4; echo [TD BOSS WAVE 40] >>> GIANT BEBOP (1.95x Size, +16000 HP, +350% Gun / +225% Total Dmg) HAS ENTERED THE LANE! <<<"
alias td_boss_wave_50 "bot_kick_all; citadel_create_unit hero_krill enemy; citadel_bot_give_all_abilities; ent_fire player AddModifier td_boss_hero_stats_5; ent_fire !player RemoveModifier td_boss_hero_stats_5; echo [TD BOSS WAVE 50+] >>> COLOSSAL MO & KRILL (2.10x Size, +25000 HP, +500% Gun / +300% Total Dmg) HAS ENTERED THE LANE! <<<"

// Boss Escalation Chain (Wave 10 -> 20 -> 30 -> 40 -> 50+)
alias td_boss_stage_1 "td_boss_wave_10; alias td_trigger_boss_wave td_boss_stage_2"
alias td_boss_stage_2 "td_boss_wave_20; alias td_trigger_boss_wave td_boss_stage_3"
alias td_boss_stage_3 "td_boss_wave_30; alias td_trigger_boss_wave td_boss_stage_4"
alias td_boss_stage_4 "td_boss_wave_40; alias td_trigger_boss_wave td_boss_stage_5"
alias td_boss_stage_5 "td_boss_wave_50"
alias td_trigger_boss_wave "td_boss_stage_1"

// Manual console shortcut to test spawning the next Giant Enemy Hero Boss immediately:
alias td_spawn_boss "td_trigger_boss_wave"

// 10-Wave Modulo Counter (fires td_trigger_boss_wave on every 10th wave tick: Wave 10, 20, 30, 40, 50...)
alias td_boss_tick_w1 "alias td_boss_wave_tick td_boss_tick_w2"
alias td_boss_tick_w2 "alias td_boss_wave_tick td_boss_tick_w3"
alias td_boss_tick_w3 "alias td_boss_wave_tick td_boss_tick_w4"
alias td_boss_tick_w4 "alias td_boss_wave_tick td_boss_tick_w5"
alias td_boss_tick_w5 "alias td_boss_wave_tick td_boss_tick_w6"
alias td_boss_tick_w6 "alias td_boss_wave_tick td_boss_tick_w7"
alias td_boss_tick_w7 "alias td_boss_wave_tick td_boss_tick_w8"
alias td_boss_tick_w8 "alias td_boss_wave_tick td_boss_tick_w9"
alias td_boss_tick_w9 "alias td_boss_wave_tick td_boss_tick_w10"
alias td_boss_tick_w10 "td_trigger_boss_wave; alias td_boss_wave_tick td_boss_tick_w1"
alias td_boss_wave_tick "td_boss_tick_w1"

// =========================================================================
// AUTOMATIC WAVE HOOKS (Triggered by logic_auto in dl_defense.vpk)
// =========================================================================
alias td_spawn_neutrals "ent_fire info_neutral_trooper_camp SpawnNeutrals"
alias td_apply_creep_buffs "td_apply_size; td_apply_strength"
alias td_wave_tick_client "td_spawn_neutrals; td_grow_numbers; td_grow_size; td_grow_strength; td_apply_creep_buffs; td_boss_wave_tick"

