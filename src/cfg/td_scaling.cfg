// =========================================================================
// Deadlock Tower Defense - Creep Scaling Config (td_scaling.cfg)
// =========================================================================
// Easily modify the independent scaling dimensions below:
//   1. SIZE     (3D Model Scale of Creeps via td_size_tier1..10: 0.95x -> 3.50x)
//   2. STRENGTH (Creep Max Health & Outgoing Damage: 150 HP -> 73,150 HP, +125% -> +12500% Dmg)
//   3. SOULS    (Soul Bounty per Creep via citadel_trooper_gold_reward & td_grow_souls)
//   4. NUMBERS  (Extra Creep Squads per Wave via citadel_spawn_trooper_wave: +4 -> +24)
// =========================================================================

// Keep sudden-death trooper health multiplier disabled (9999s) so Wave 1 starts at 150 HP
citadel_trooper_health_mult_gametime 9999

// First wave spawns 5 seconds after load; disable vanilla 20m/35m interval overrides
citadel_trooper_spawn_initial 5
citadel_trooper_spawn_interval_late_time 999
citadel_trooper_spawn_interval_very_late_time 999

// Raise lane cap so large multi-squad waves never get throttled (default is 16)
citadel_trooper_max_per_lane 120

// =========================================================================
// 1. SIZE SCALING (3D Model Scale of Creeps — 0.95x Start -> 3.50x Growth)
// =========================================================================
// Each tier stacks permanent model-scale modifiers on all lane & neutral creeps:
//   Tier 1:  0.95x | Tier 2:  1.15x | Tier 3:  1.35x | Tier 4:  1.60x | Tier 5:  1.85x
//   Tier 6:  2.15x | Tier 7:  2.45x | Tier 8:  2.80x | Tier 9:  3.15x | Tier 10: 3.50x
alias td_size_tier1 "ent_fire npc_trooper AddModifier td_creep_size_1; ent_fire npc_trooper_neutral AddModifier td_creep_size_1"
alias td_size_tier2 "td_size_tier1; ent_fire npc_trooper AddModifier td_creep_size_2; ent_fire npc_trooper_neutral AddModifier td_creep_size_2"
alias td_size_tier3 "td_size_tier2; ent_fire npc_trooper AddModifier td_creep_size_3; ent_fire npc_trooper_neutral AddModifier td_creep_size_3"
alias td_size_tier4 "td_size_tier3; ent_fire npc_trooper AddModifier td_creep_size_4; ent_fire npc_trooper_neutral AddModifier td_creep_size_4"
alias td_size_tier5 "td_size_tier4; ent_fire npc_trooper AddModifier td_creep_size_5; ent_fire npc_trooper_neutral AddModifier td_creep_size_5"
alias td_size_tier6 "td_size_tier5; ent_fire npc_trooper AddModifier td_creep_size_6; ent_fire npc_trooper_neutral AddModifier td_creep_size_6"
alias td_size_tier7 "td_size_tier6; ent_fire npc_trooper AddModifier td_creep_size_7; ent_fire npc_trooper_neutral AddModifier td_creep_size_7"
alias td_size_tier8 "td_size_tier7; ent_fire npc_trooper AddModifier td_creep_size_8; ent_fire npc_trooper_neutral AddModifier td_creep_size_8"
alias td_size_tier9 "td_size_tier8; ent_fire npc_trooper AddModifier td_creep_size_9; ent_fire npc_trooper_neutral AddModifier td_creep_size_9"
alias td_size_tier10 "td_size_tier9; ent_fire npc_trooper AddModifier td_creep_size_10; ent_fire npc_trooper_neutral AddModifier td_creep_size_10"

// Active size tier (starts at Tier 1 and escalates every 20s wave tick)
alias td_apply_size "td_size_tier1"
alias td_grow_size_w1 "alias td_apply_size td_size_tier2; alias td_grow_size td_grow_size_w2"
alias td_grow_size_w2 "alias td_apply_size td_size_tier3; alias td_grow_size td_grow_size_w3"
alias td_grow_size_w3 "alias td_apply_size td_size_tier4; alias td_grow_size td_grow_size_w4"
alias td_grow_size_w4 "alias td_apply_size td_size_tier5; alias td_grow_size td_grow_size_w5"
alias td_grow_size_w5 "alias td_apply_size td_size_tier6; alias td_grow_size td_grow_size_w6"
alias td_grow_size_w6 "alias td_apply_size td_size_tier7; alias td_grow_size td_grow_size_w7"
alias td_grow_size_w7 "alias td_apply_size td_size_tier8; alias td_grow_size td_grow_size_w8"
alias td_grow_size_w8 "alias td_apply_size td_size_tier9; alias td_grow_size td_grow_size_w9"
alias td_grow_size_w9 "alias td_apply_size td_size_tier10"
alias td_grow_size "td_grow_size_w1"

// =========================================================================
// 2. STRENGTH SCALING (150 HP Start -> 25x Total Faster Scaling: 73,150 HP)
// =========================================================================
// Uses CAI_BaseNPC_API::OverrideHealth + SetHealth (5x faster growth per tier):
//   Tier 1:  150 HP    | Tier 2:  1,150 HP  | Tier 3:  2,650 HP  | Tier 4:  4,900 HP  | Tier 5:  8,150 HP
//   Tier 6:  13,150 HP | Tier 7:  20,650 HP | Tier 8:  31,900 HP | Tier 9:  48,150 HP | Tier 10: 73,150 HP
alias td_hp_tier1 "ent_fire npc_trooper OverrideHealth 150; ent_fire npc_trooper SetHealth 150; ent_fire npc_trooper_neutral OverrideHealth 150; ent_fire npc_trooper_neutral SetHealth 150"
alias td_hp_tier2 "ent_fire npc_trooper OverrideHealth 1150; ent_fire npc_trooper SetHealth 1150; ent_fire npc_trooper_neutral OverrideHealth 1150; ent_fire npc_trooper_neutral SetHealth 1150"
alias td_hp_tier3 "ent_fire npc_trooper OverrideHealth 2650; ent_fire npc_trooper SetHealth 2650; ent_fire npc_trooper_neutral OverrideHealth 2650; ent_fire npc_trooper_neutral SetHealth 2650"
alias td_hp_tier4 "ent_fire npc_trooper OverrideHealth 4900; ent_fire npc_trooper SetHealth 4900; ent_fire npc_trooper_neutral OverrideHealth 4900; ent_fire npc_trooper_neutral SetHealth 4900"
alias td_hp_tier5 "ent_fire npc_trooper OverrideHealth 8150; ent_fire npc_trooper SetHealth 8150; ent_fire npc_trooper_neutral OverrideHealth 8150; ent_fire npc_trooper_neutral SetHealth 8150"
alias td_hp_tier6 "ent_fire npc_trooper OverrideHealth 13150; ent_fire npc_trooper SetHealth 13150; ent_fire npc_trooper_neutral OverrideHealth 13150; ent_fire npc_trooper_neutral SetHealth 13150"
alias td_hp_tier7 "ent_fire npc_trooper OverrideHealth 20650; ent_fire npc_trooper SetHealth 20650; ent_fire npc_trooper_neutral OverrideHealth 20650; ent_fire npc_trooper_neutral SetHealth 20650"
alias td_hp_tier8 "ent_fire npc_trooper OverrideHealth 31900; ent_fire npc_trooper SetHealth 31900; ent_fire npc_trooper_neutral OverrideHealth 31900; ent_fire npc_trooper_neutral SetHealth 31900"
alias td_hp_tier9 "ent_fire npc_trooper OverrideHealth 48150; ent_fire npc_trooper SetHealth 48150; ent_fire npc_trooper_neutral OverrideHealth 48150; ent_fire npc_trooper_neutral SetHealth 48150"
alias td_hp_tier10 "ent_fire npc_trooper OverrideHealth 73150; ent_fire npc_trooper SetHealth 73150; ent_fire npc_trooper_neutral OverrideHealth 73150; ent_fire npc_trooper_neutral SetHealth 73150"

// Cumulative strength modifiers + OverrideHealth applied last so exact tier HP is enforced:
alias td_strength_mod1 "ent_fire npc_trooper AddModifier td_creep_strength_1; ent_fire npc_trooper_neutral AddModifier td_creep_strength_1"
alias td_strength_mod2 "td_strength_mod1; ent_fire npc_trooper AddModifier modifier_citadel_trooper_shrine_down_buff; ent_fire npc_trooper AddModifier td_creep_strength_2; ent_fire npc_trooper_neutral AddModifier td_creep_strength_2"
alias td_strength_mod3 "td_strength_mod2; ent_fire npc_trooper AddModifier td_creep_strength_3; ent_fire npc_trooper_neutral AddModifier td_creep_strength_3"
alias td_strength_mod4 "td_strength_mod3; ent_fire npc_trooper AddModifier td_creep_strength_4; ent_fire npc_trooper_neutral AddModifier td_creep_strength_4"
alias td_strength_mod5 "td_strength_mod4; ent_fire npc_trooper AddModifier td_creep_strength_5; ent_fire npc_trooper_neutral AddModifier td_creep_strength_5"
alias td_strength_mod6 "td_strength_mod5; ent_fire npc_trooper AddModifier td_creep_strength_6; ent_fire npc_trooper_neutral AddModifier td_creep_strength_6"
alias td_strength_mod7 "td_strength_mod6; ent_fire npc_trooper AddModifier td_creep_strength_7; ent_fire npc_trooper_neutral AddModifier td_creep_strength_7"
alias td_strength_mod8 "td_strength_mod7; ent_fire npc_trooper AddModifier td_creep_strength_8; ent_fire npc_trooper_neutral AddModifier td_creep_strength_8"
alias td_strength_mod9 "td_strength_mod8; ent_fire npc_trooper AddModifier td_creep_strength_9; ent_fire npc_trooper_neutral AddModifier td_creep_strength_9"
alias td_strength_mod10 "td_strength_mod9; ent_fire npc_trooper AddModifier td_creep_strength_10; ent_fire npc_trooper_neutral AddModifier td_creep_strength_10"

alias td_strength_tier1 "td_strength_mod1; td_hp_tier1"
alias td_strength_tier2 "td_strength_mod2; td_hp_tier2"
alias td_strength_tier3 "td_strength_mod3; td_hp_tier3"
alias td_strength_tier4 "td_strength_mod4; td_hp_tier4"
alias td_strength_tier5 "td_strength_mod5; td_hp_tier5"
alias td_strength_tier6 "td_strength_mod6; td_hp_tier6"
alias td_strength_tier7 "td_strength_mod7; td_hp_tier7"
alias td_strength_tier8 "td_strength_mod8; td_hp_tier8"
alias td_strength_tier9 "td_strength_mod9; td_hp_tier9"
alias td_strength_tier10 "td_strength_mod10; td_hp_tier10"

alias td_apply_strength "td_strength_tier1"
alias td_grow_strength_w1 "alias td_apply_strength td_strength_tier2; alias td_grow_strength td_grow_strength_w2"
alias td_grow_strength_w2 "alias td_apply_strength td_strength_tier3; alias td_grow_strength td_grow_strength_w3"
alias td_grow_strength_w3 "alias td_apply_strength td_strength_tier4; alias td_grow_strength td_grow_strength_w4"
alias td_grow_strength_w4 "alias td_apply_strength td_strength_tier5; alias td_grow_strength td_grow_strength_w5"
alias td_grow_strength_w5 "alias td_apply_strength td_strength_tier6; alias td_grow_strength td_grow_strength_w6"
alias td_grow_strength_w6 "alias td_apply_strength td_strength_tier7; alias td_grow_strength td_grow_strength_w7"
alias td_grow_strength_w7 "alias td_apply_strength td_strength_tier8; alias td_grow_strength td_grow_strength_w8"
alias td_grow_strength_w8 "alias td_apply_strength td_strength_tier9; alias td_grow_strength td_grow_strength_w9"
alias td_grow_strength_w9 "alias td_apply_strength td_strength_tier10; alias td_grow_strength td_grow_strength_w10"
alias td_grow_strength_w10 "td_hp_tier10"
alias td_grow_strength "td_grow_strength_w1"

// =========================================================================
// 3. SOULS SCALING (Soul Bounty per Creep — 5x Faster Scaling)
// =========================================================================
// Starting Souls per creep (250 Souls on Wave 1) + passive bonus per minute (2500/min)
citadel_trooper_gold_reward 250
citadel_trooper_gold_reward_bonus_per_minute 2500

// Per-Wave Souls Growth (+1250 Souls per creep every 20s, up to 100000)
alias td_grow_souls "incrementvar citadel_trooper_gold_reward 100 100000 1250"

// =========================================================================
// 4. NUMBERS SCALING (Extra Creep Squads Spawned per Wave — 1 -> 6 Extra Squads)
// =========================================================================
// Each citadel_spawn_trooper_wave call spawns +4 creeps in Center Lane:
//   Tier 1-2 = +4 extra creeps (8 total)
//   Tier 3-4 = +8 extra creeps (12 total)
//   Tier 5   = +12 extra creeps (16 total)
//   Tier 6   = +16 extra creeps (20 total)
//   Tier 7   = +20 extra creeps (24 total)
//   Tier 8+  = +24 extra creeps (28 total)
alias td_numbers_tier1 "citadel_spawn_trooper_wave"
alias td_numbers_tier2 "citadel_spawn_trooper_wave"
alias td_numbers_tier3 "citadel_spawn_trooper_wave; citadel_spawn_trooper_wave"
alias td_numbers_tier4 "citadel_spawn_trooper_wave; citadel_spawn_trooper_wave"
alias td_numbers_tier5 "citadel_spawn_trooper_wave; citadel_spawn_trooper_wave; citadel_spawn_trooper_wave"
alias td_numbers_tier6 "citadel_spawn_trooper_wave; citadel_spawn_trooper_wave; citadel_spawn_trooper_wave; citadel_spawn_trooper_wave"
alias td_numbers_tier7 "citadel_spawn_trooper_wave; citadel_spawn_trooper_wave; citadel_spawn_trooper_wave; citadel_spawn_trooper_wave; citadel_spawn_trooper_wave"
alias td_numbers_tier8 "citadel_spawn_trooper_wave; citadel_spawn_trooper_wave; citadel_spawn_trooper_wave; citadel_spawn_trooper_wave; citadel_spawn_trooper_wave; citadel_spawn_trooper_wave"

alias td_grow_numbers_w1 "td_numbers_tier1; alias td_grow_numbers td_grow_numbers_w2"
alias td_grow_numbers_w2 "td_numbers_tier2; alias td_grow_numbers td_grow_numbers_w3"
alias td_grow_numbers_w3 "td_numbers_tier3; alias td_grow_numbers td_grow_numbers_w4"
alias td_grow_numbers_w4 "td_numbers_tier4; alias td_grow_numbers td_grow_numbers_w5"
alias td_grow_numbers_w5 "td_numbers_tier5; alias td_grow_numbers td_grow_numbers_w6"
alias td_grow_numbers_w6 "td_numbers_tier6; alias td_grow_numbers td_grow_numbers_w7"
alias td_grow_numbers_w7 "td_numbers_tier7; alias td_grow_numbers td_grow_numbers_w8"
alias td_grow_numbers_w8 "td_numbers_tier8"
alias td_grow_numbers "td_grow_numbers_w1"

// =========================================================================
// AUTOMATIC WAVE HOOKS (Triggered by logic_auto in dl_defense.vpk)
// =========================================================================
alias td_spawn_neutrals "ent_fire info_neutral_trooper_camp SpawnNeutrals"
alias td_apply_creep_buffs "td_apply_size; td_apply_strength"
alias td_wave_tick_client "td_spawn_neutrals; td_grow_numbers; td_grow_size; td_grow_strength; td_apply_creep_buffs"

echo "==================================================================="
echo "[TD] Loaded td_scaling.cfg (150 HP Start -> 5x Faster Scaling: 73,150 HP)"
echo "  1. SIZE:     0.95x -> 3.50x Creeps (td_size_tier1..10)"
echo "  2. STRENGTH: 150 HP -> 73,150 HP (OverrideHealth) & +500% DPS/min"
echo "  3. SOULS:    250 start + 1250 Souls/creep per wave + 2500/min"
echo "  4. NUMBERS:  +4 -> +24 extra creeps spawned per wave (td_numbers_tier1..8)"
echo "==================================================================="
