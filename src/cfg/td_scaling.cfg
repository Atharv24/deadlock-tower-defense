// =========================================================================
// Deadlock Tower Defense - Phase 2 Creep Scaling Configuration (td_scaling.cfg)
// =========================================================================
// Edit the starting values and per-wave growth aliases below to tune
// Size, Strength (Health & Damage), Souls, and Numbers!
// Syntax for growth: incrementvar <convar> <min_value> <max_value> <delta_per_wave>
// =========================================================================

// Enable immediate trooper health & model size multipliers from minute 0 (t = 0)
citadel_trooper_health_mult_gametime -1

// First wave spawns 5 seconds after load; disable vanilla 20m/35m interval overrides
citadel_trooper_spawn_initial 5
citadel_trooper_spawn_interval_late_time 999
citadel_trooper_spawn_interval_very_late_time 999

// =========================================================================
// 1. SIZE SCALING (3D Model Scale of Creeps)
// =========================================================================
// Starting Size (1.0 = normal size; 1.25 = 25% larger on Wave 1)
citadel_trooper_health_model_scale 1.25

// Per-Wave Size Growth (+0.35x model size every 20s, up to 3.5x giant creeps!)
alias td_grow_size "incrementvar citadel_trooper_health_model_scale 1.0 3.5 0.35"

// =========================================================================
// 2. STRENGTH SCALING (Creep Max Health & Damage to Players)
// =========================================================================
// Starting Health Multiplier (1.5 = 150% base HP on Wave 1)
citadel_trooper_health_mult 1.5

// Starting Damage Multiplier (1.0 = 100% damage on Wave 1)
citadel_player_damage_from_trooper_scale 1.0

// Per-Wave Strength Growth (+1.2x HP mult and +0.6x Damage mult every 20s!)
alias td_grow_health "incrementvar citadel_trooper_health_mult 1.0 40.0 1.2"
alias td_grow_damage "incrementvar citadel_player_damage_from_trooper_scale 0.5 20.0 0.6"

// =========================================================================
// 3. SOULS SCALING (Soul Bounty per Creep)
// =========================================================================
// Starting Souls per creep (250 Souls on Wave 1) + passive bonus per minute (150/min)
citadel_trooper_gold_reward 250
citadel_trooper_gold_reward_bonus_per_minute 150

// Per-Wave Souls Growth (+200 Souls per creep every 20s, up to 10000!)
alias td_grow_souls "incrementvar citadel_trooper_gold_reward 100 10000 200"

// =========================================================================
// 4. NUMBERS SCALING (Creeps per Squad & Wave Spawn Interval)
// =========================================================================
// Raise lane cap so large waves never get throttled (default is 16)
citadel_trooper_max_per_lane 120

// Starting Squad Size (6 creeps on Wave 1) and Wave Interval (20 seconds)
citadel_trooper_squad_size 6
citadel_trooper_spawn_interval_early 20

// Per-Wave Numbers Growth (+3 creeps per squad up to 36, and -2s faster wave interval down to 8s!)
alias td_grow_numbers "incrementvar citadel_trooper_squad_size 4 36 3"
alias td_grow_interval "incrementvar citadel_trooper_spawn_interval_early 8 30 -2"

echo "==================================================================="
echo "[TD Phase 2] Loaded td_scaling.cfg (High-Growth Test Profile Active)"
echo "  Wave 1 Start -> Size: 1.25x | HP: 1.5x | Dmg: 1.0x | Souls: 250 | Squad: 6 | Interval: 20s"
echo "  Every 20s    -> Size: +0.35x | HP: +1.2x | Dmg: +0.6x | Souls: +200 | Squad: +3 | Interval: -2s"
echo "==================================================================="
