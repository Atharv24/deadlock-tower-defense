// =========================================================================
// Deadlock Tower Defense - Phase 1 Launcher (dl_defense)
// =========================================================================
sv_cheats 1

// Keep citadel_hero_testing_enabled 0 during initial map connect so GetDefaultTeamForPlayer
// uses citadel_player_starting_team 2 (Hidden King) + citadel_player_starting_hero immediately,
// bypassing the "Select a Side" prompt. td_postload.cfg then enables Hero Testing mode at t=1.0s.
citadel_hero_testing_enabled 0
citadel_coop_sandbox 1
citadel_hero_testing_infinite_money 0
citadel_hero_demo_no_troopers 0
citadel_solo_bot_match 0
citadel_player_starting_team 2
citadel_player_starting_hero "hero_forge"
citadel_cinematic_intro_enabled -1
citadel_allow_purchasing_anywhere 1
citadel_hero_testing_legendary_items 1
citadel_active_lane 4

echo "==================================================================="
echo "[TD Phase 1] Loading custom map dl_defense (Center Lane Only, Friendly Blue T1 Guardian Active, Normal Soul Economy, Legendary T5 Items Unlocked)..."
echo "==================================================================="

map dl_defense
